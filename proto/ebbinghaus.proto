syntax = "proto3";

package ebbinghaus;

// storage service for kv operations and leader-follower replication
service EbbinghausService
{
    // retrieve a value by key (triggers rehearsal / promotion)
    rpc Get (GetRequest) returns (GetResponse);

    // write a key-value pair
    rpc Put (PutRequest) returns (PutResponse);

    // tombstone delete a key
    rpc Delete (DeleteRequest) returns (DeleteResponse);

    // replicate a batch of operations from leader to follower
    rpc Replicate (ReplicateRequest) returns (ReplicateResponse);
}

message GetRequest
{
    bytes key = 1;
}

message GetResponse
{
    bool found = 1;
    bytes value = 2;
}

message PutRequest
{
    bytes key = 1;
    bytes value = 2;
}

message PutResponse
{
    bool success = 1;
}

message DeleteRequest
{
    bytes key = 1;
}

message DeleteResponse
{
    bool success = 1;
}

enum RecordOp
{
    PUT = 0;
    DELETE = 1;
}

message ReplicationRecord
{
    RecordOp op = 1;
    bytes key = 2;
    bytes value = 3;
    uint64 timestamp = 4;
    uint32 access_count = 5;
}

message ReplicateRequest
{
    repeated ReplicationRecord records = 1;
}

message ReplicateResponse
{
    bool acknowledged = 1;
}


[package]
name = "ebbinghaus-store"
version = "0.1.0"
edition = "2024"
default-run = "ebbinghaus-store"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
dashmap = "6.0"
crc32fast = "1.5.0"
tonic = "0.12"
prost = "0.13"
prometheus = "0.13"

[build-dependencies]
tonic-build = "0.12"
